# `docker compose up` is the only command needed for the submission demo.
#
# Services: mysql, backend, frontend, ollama. Memory limits add up to well under
# the 8 GB budget: mysql 512m + backend 2g + frontend 1g + ollama 4g = 7.5 GB.

services:
  mysql:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: amypo-root
      MYSQL_DATABASE: amypo
      MYSQL_USER: amypo
      MYSQL_PASSWORD: amypo
    ports:
      - "3306:3306"
    volumes:
      # Named volume: seeded data survives restarts.
      - amypo_mysql:/var/lib/mysql
      # Schema init runs on first start (empty volume) from /db/migrations.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uamypo", "-pamypo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AMYPO_MYSQL_HOST: mysql
      AMYPO_MYSQL_PORT: "3306"
      AMYPO_MYSQL_USER: amypo
      AMYPO_MYSQL_PASSWORD: amypo
      AMYPO_MYSQL_DATABASE: amypo
      # The app resolves data/ and docs/ relative to its project root, which is
      # /app inside the image. Both directories are mounted from the host under
      # /data and /docs, so point the settings at those paths -- without this the
      # benchmark file and the report directory are looked for at /app/data and
      # /app/docs, which do not exist, and /eval/run answers 500.
      AMYPO_DATA_DIR: /data
      AMYPO_DOCS_DIR: /docs
      AMYPO_OLLAMA_BASE_URL: http://ollama:11434
      AMYPO_ALLOW_REAL_MODELS: "true"
      # Sessions. The secret is read from the environment and never baked into
      # the image; leaving it empty makes the backend generate a random key per
      # process, which logs everyone out on restart but is always safe.
      AMYPO_JWT_SECRET: ${AMYPO_JWT_SECRET:-}
      # Seeds the demo accounts (admin / staff.* / one login per student) and
      # turns on the collapsed demo panel on the login page.
      AMYPO_DEMO_MODE: "true"
      # Optional read-only key for the organisers' evaluation harness.
      AMYPO_SERVICE_API_KEY: ${AMYPO_SERVICE_API_KEY:-}
    volumes:
      - ./data:/data
      - ./docs:/docs
    mem_limit: 2g
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The frontend proxies /api/v1/* to this origin from its Next server, and
        # rewrites() is evaluated at build time, so the value has to be a build
        # arg. "backend" resolves on the compose network when the Next server
        # makes the upstream call, which is why the service name is correct here
        # even though it is not resolvable at build time.
        NEXT_PUBLIC_API_URL: http://backend:8000
        # Shows the collapsed "Demo accounts" panel on the login screen. Public
        # by design: it is a build-time flag, not a secret.
        NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    mem_limit: 1g
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # The container keeps its own model store. `ollama pull` run on Windows or
      # macOS fills the *host* store (C:\Users\...\.ollama or ~/.ollama) and the
      # backend never sees it -- that is why a freshly pulled phi3:mini still
      # showed as unavailable. `ollama-pull` below fills this volume instead.
      - amypo_ollama:/root/.ollama
    mem_limit: 4g

  # One-shot model bootstrap, so `docker compose up` yields a working local
  # model with no manual step. Idempotent: pulling a tag that is already there
  # is a no-op, and the container exits once the model is in place. The backend
  # starts extractive and re-probes every few seconds, so the order does not
  # matter.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      # Talk to the service over the compose network, not to ourselves.
      OLLAMA_HOST: http://ollama:11434
      AMYPO_OLLAMA_MODEL: ${AMYPO_OLLAMA_MODEL:-phi3:mini}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${AMYPO_OLLAMA_MODEL}"
        echo "model ready: $${AMYPO_OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_started
    restart: "no"

volumes:
  amypo_mysql:
  amypo_ollama:
