# `docker compose up` is the only command needed for the submission demo.
#
# Services: mysql, backend, frontend, ollama. Memory limits add up to well under
# the 8 GB budget: mysql 512m + backend 2g + frontend 1g + ollama 4g = 7.5 GB.

services:
  mysql:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: amypo-root
      MYSQL_DATABASE: amypo
      MYSQL_USER: amypo
      MYSQL_PASSWORD: amypo
    ports:
      - "3306:3306"
    volumes:
      # Named volume: seeded data survives restarts.
      - amypo_mysql:/var/lib/mysql
      # Schema init runs on first start (empty volume) from /db/migrations.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uamypo", "-pamypo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AMYPO_MYSQL_HOST: mysql
      AMYPO_MYSQL_PORT: "3306"
      AMYPO_MYSQL_USER: amypo
      AMYPO_MYSQL_PASSWORD: amypo
      AMYPO_MYSQL_DATABASE: amypo
      AMYPO_OLLAMA_BASE_URL: http://ollama:11434
      AMYPO_ALLOW_REAL_MODELS: "true"
    volumes:
      - ./data:/data
      - ./docs:/docs
    mem_limit: 2g
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    mem_limit: 1g
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Pre-bake models for offline use:
      #   docker run --rm -v amypo_ollama:/root/.ollama ollama/ollama pull phi3:mini
      - amypo_ollama:/root/.ollama
    mem_limit: 4g

volumes:
  amypo_mysql:
  amypo_ollama:
